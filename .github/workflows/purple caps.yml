name: Run Discord Daily Bot (schedule + manual) purple caps

on:
  schedule:
    - cron: '0 17 * * *' # Daily at 1:00am Malaysia time
  workflow_dispatch:

jobs:
  run-bot:
    name: Run Purple Caps bot
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Purple Caps downloads cache
        uses: actions/cache@v4
        with:
          path: discord-daily-bot/downloads-purple-caps
          key: purple-caps-downloads-${{ github.run_id }}
          restore-keys: |
            purple-caps-downloads-

      - name: Debug workspace
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "PWD=$(pwd)"
          echo "List workspace root:"
          ls -la "$GITHUB_WORKSPACE" || true

          echo "List repository files:"
          ls -la . || true

          echo "Locate package.json files:"
          find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -name "package.json" -print || true

      - name: Pull and run Purple Caps bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: ${{ vars.CHANNEL_ID_CAPS }}
          WEBPAGE_URL: https://uma.moe/circles/740624934
          DELETE_EXISTING: 'true'
          TZ: Asia/Kuala_Lumpur
        run: |
          set -o pipefail

          DOWNLOADS_DIR="$GITHUB_WORKSPACE/discord-daily-bot/downloads-purple-caps"
          IMAGE="stressgilababi/discord-daily-bot:latest"

          mkdir -p "$DOWNLOADS_DIR"

          echo "Pulling image: $IMAGE"
          docker pull "$IMAGE"

          echo "Running Purple Caps bot"
          echo "Channel ID: $CHANNEL_ID"
          echo "Webpage URL: $WEBPAGE_URL"

          timeout 12m docker run --rm --shm-size=1g \
            --user root \
            -e DISCORD_TOKEN \
            -e CHANNEL_ID \
            -e WEBPAGE_URL \
            -e DELETE_EXISTING \
            -e TZ \
            -v "$DOWNLOADS_DIR":/app/downloads \
            "$IMAGE" \
            /bin/bash -lc "node index.js" 2>&1 | tee run-purple-caps.log

          exit ${PIPESTATUS[0]}

      - name: Upload Purple Caps run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purple-caps-run-logs-${{ github.run_id }}
          path: run-purple-caps.log
          if-no-files-found: warn
